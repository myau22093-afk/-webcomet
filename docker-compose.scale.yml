# Scale for ~3k concurrent online (Cloudflare + 3 app instances)
# Needs VPS with at least 8 GB RAM / 4 vCPU (better 12 GB).
#
# Switch from single-container:
#   docker compose down
#   docker compose -f docker-compose.scale.yml up -d --build
#
# Back to single:
#   docker compose -f docker-compose.scale.yml down
#   docker compose up -d

services:
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
    volumes:
      - ./Caddyfile.scale:/etc/caddy/Caddyfile:ro
    depends_on:
      - webcomet1
      - webcomet2
      - webcomet3
    restart: unless-stopped
    mem_limit: 128m

  webcomet1: &webcomet
    build:
      context: .
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://webcomet.ru}
    env_file:
      - .env
    environment:
      PORT: "8080"
      HOSTNAME: "0.0.0.0"
      NODE_ENV: production
      AI_MAX_CONCURRENT: ${AI_MAX_CONCURRENT:-6}
      AI_QUEUE_WAIT_MS: ${AI_QUEUE_WAIT_MS:-0}
    expose:
      - "8080"
    volumes:
      - webcomet_uploads:/app/public/uploads
    restart: unless-stopped
    mem_limit: 2300m
    cpus: 1.25

  webcomet2:
    <<: *webcomet

  webcomet3:
    <<: *webcomet

volumes:
  webcomet_uploads:
