services:
  webcomet:
    build:
      context: .
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://webcomet.ru}
    env_file:
      - .env
    environment:
      PORT: "8080"
      HOSTNAME: "0.0.0.0"
      NODE_ENV: production
      AI_MAX_CONCURRENT: ${AI_MAX_CONCURRENT:-4}
      AI_QUEUE_WAIT_MS: ${AI_QUEUE_WAIT_MS:-120000}
    ports:
      - "80:8080"
    volumes:
      # Сохраняем /uploads между пересборками контейнера
      - webcomet_uploads:/app/public/uploads
    restart: unless-stopped
    mem_limit: 1536m
    cpus: 1.5

volumes:
  webcomet_uploads:
