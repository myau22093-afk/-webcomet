services:
  webcomet:
    build:
      context: .
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://webcomet.ru}
        NEXT_PUBLIC_PUBLISH_BASE_DOMAIN: ${NEXT_PUBLIC_PUBLISH_BASE_DOMAIN:-webcomet.ru}
    env_file:
      - .env
    environment:
      PORT: "8080"
      HOSTNAME: "0.0.0.0"
      NODE_ENV: production
      AI_MAX_CONCURRENT: ${AI_MAX_CONCURRENT:-4}
      AI_QUEUE_WAIT_MS: ${AI_QUEUE_WAIT_MS:-120000}
    expose:
      - "8080"
    volumes:
      - webcomet_uploads:/app/public/uploads
      - webcomet_hosted:/app/public/hosted
    restart: unless-stopped
    mem_limit: 1536m
    cpus: 1.5

  # HTTPS (Let's Encrypt) при сером облаке Cloudflare (DNS only)
  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - webcomet
    restart: unless-stopped

volumes:
  webcomet_uploads:
  webcomet_hosted:
  caddy_data:
  caddy_config:
